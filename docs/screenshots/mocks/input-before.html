<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>入力シート（取り込み前）</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&display=swap');
  html, body { margin: 0; background: #f4f5f7; font-family: "Noto Sans CJK JP", "Noto Sans JP", sans-serif; color: #202124; }
  .wrap { padding: 28px 32px 24px; }
  .kicker { font-size: 13px; color: #5f6368; margin: 0 0 6px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  .caption { font-size: 13px; color: #5f6368; margin: 0 0 16px; line-height: 1.5; }
  table { border-collapse: collapse; width: 100%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  th { background: #e8f0fe; text-align: left; font-size: 13px; padding: 10px 12px; border: 1px solid #c5d4f0; white-space: nowrap; }
  td { font-size: 13px; padding: 10px 12px; border: 1px solid #e0e0e0; }
  td.hl { background: #fef7e0; font-weight: 700; }
  td.ok { background: #e6f4ea; }
  .note { margin-top: 14px; font-size: 12px; color: #5f6368; }
  .sub { margin: 22px 0 10px; font-size: 16px; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="kicker">説明用の図（実際の Google 画面のスクリーンショットではありません）</p>
    <h1>入力シート（取り込み前）</h1>
    <p class="caption">Excel / CSV と同じ4列です。3行目は1行目と同じ「日付＋商品名」なので、取り込み時にスキップされます。</p>
    <table><thead><tr><th>日付</th><th>商品名（ダミー）</th><th>数量</th><th>メモ</th></tr></thead><tbody><tr><td class="">2026-11-01</td><td class="">サンプル紅茶（ダミー）</td><td class="">3</td><td class="">初回分</td></tr><tr><td class="">2026-11-02</td><td class="">サンプルクッキー（ダミー）</td><td class="">10</td><td class=""></td></tr><tr><td class="hl">2026-11-01</td><td class="hl">サンプル紅茶（ダミー）</td><td class="">3</td><td class="hl">同じキーの重複行（スキップされる）</td></tr><tr><td class="">2026-11-03</td><td class="">サンプル緑茶（ダミー）</td><td class="">2</td><td class="">新規</td></tr></tbody></table>
    
    <p class="note">ダミーデータのみ。実在の商品名や取引先は使っていません。</p>
  </div>
</body>
</html>
